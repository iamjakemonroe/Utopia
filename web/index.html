<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play chess, checkers, Ludo and Guess My Doodle with friends in Utopia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Utopia">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <meta name="theme-color" content="#120B2E">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Utopia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #120B2E; }
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 80% at 50% 0%, #2a1a63 0%, #120B2E 55%, #0b0720 100%);
      transition: opacity 0.4s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { border-radius: 24px; animation: bob 1.6s ease-in-out infinite; }
    #loading .dots { display: flex; gap: 8px; }
    #loading .dots span {
      width: 9px; height: 9px; border-radius: 50%; background: #ffc94d;
      animation: blink 1.2s ease-in-out infinite;
    }
    #loading .dots span:nth-child(2) { animation-delay: 0.2s; }
    #loading .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #loading img, #loading .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Shown while the game downloads, so the page never looks stuck; it
       fades out on the game's first frame. -->
  <div id="loading" aria-label="Loading Utopia">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>
  <script>
    // How sharp the game draws. A phone's screen is 3x, and redrawing three
    // million pixels a frame is what made the game lag in a browser: it
    // draws at 2x at most (still sharp), and the game lowers it a step at a
    // time on a device that still can't keep up (remembered here).
    // ?hires draws at the screen's full sharpness.
    window.utopiaRender = (function () {
      var desc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!desc || !desc.get || /[?&]hires/.test(location.search)) return null;
      var cap = 2;
      try {
        var saved = Number(localStorage.getItem('utopia_render_cap'));
        if (saved >= 1 && saved <= 2) cap = saved;
      } catch (e) {}
      var real = function () { return desc.get.call(window); };
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        get: function () { return Math.min(cap, real()); },
      });
      return {
        cap: function () { return cap; },
        real: real,
        set: function (value) {
          cap = value;
          try { localStorage.setItem('utopia_render_cap', String(value)); } catch (e) {}
          window.dispatchEvent(new Event('resize'));
        },
      };
    })();

    // The browser's offer to install Utopia (Chrome, Edge, Android), kept
    // for the game's own Install button instead of the browser's banner.
    window.utopiaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.utopiaInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.utopiaInstallPrompt = null;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
