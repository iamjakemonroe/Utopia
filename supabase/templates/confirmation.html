<!doctype html>
<html>
<body style="margin:0;padding:0;background-color:#1a1035;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1035;padding:32px 12px;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border-radius:24px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <tr><td align="center" style="background-color:#5b2fd0;padding:28px 24px 20px;">
      <img src="https://utopia.kaivon.app/logo.png" width="96" height="96" alt="Utopia" style="display:block;border:0;outline:none;">
      <div style="color:#ffffff;font-size:24px;font-weight:800;margin-top:6px;">Utopia</div>
    </td></tr>
    <tr><td style="padding:28px 28px 4px;color:#241c3b;">
      <div style="font-size:21px;font-weight:800;">Welcome to Utopia!</div>
      <div style="font-size:15px;line-height:22px;color:#5b5470;margin-top:6px;">Enter this code in Utopia to finish creating your account.</div>
    </td></tr>
    <tr><td align="center" style="padding:18px 28px;">
      <div style="display:inline-block;background-color:#f3eeff;border:2px solid #d9ccff;border-radius:16px;padding:14px 22px;font-size:34px;font-weight:800;letter-spacing:6px;color:#4a1fb8;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
    </td></tr>
    <tr><td style="padding:6px 28px 28px;font-size:13px;line-height:19px;color:#8a8399;">
      The code works for 1 hour. If you didn't ask for it, you can ignore this email: no one can get in without the code.
    </td></tr>
  </table>
  <div style="font-size:12px;color:#a99fd0;margin-top:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Utopia by Kaivon &middot; <a href="https://utopia.kaivon.app" style="color:#a99fd0;">utopia.kaivon.app</a></div>
</td></tr>
</table>
</body>
</html>
